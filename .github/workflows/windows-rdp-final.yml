"@ | Set-Content "$desk\3 - GUIDE (READ FIRST).txt" -Encoding UTF8

          Write-Host ""
          Write-Host "=====================================" -ForegroundColor Magenta
          Write-Host " Desktop toolkit created:"            -ForegroundColor Cyan
          Write-Host "  1 - START SAMSUNG PHONE.bat"       -ForegroundColor Yellow
          Write-Host "  2 - SETUP SPOOF.bat"               -ForegroundColor Yellow
          Write-Host "  3 - GUIDE (READ FIRST).txt"        -ForegroundColor Yellow
          Write-Host "=====================================" -ForegroundColor Magenta

      # ══════════════════════════════════════════════════════
      #  STEP 6 — Keep server alive (6 hours)
      # ══════════════════════════════════════════════════════
      - name: 6. Keep Server Alive
        shell: pwsh
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server alive..."
          }
