name: Windows Cloud RDP

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ══════════════════════════════════════════════
      #  1. Enable Remote Desktop
      # ══════════════════════════════════════════════
      - name: 1. Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 0
          Write-Host "RDP enabled."

      # ══════════════════════════════════════════════
      #  2. Create Admin Account
      # ══════════════════════════════════════════════
      - name: 2. Create Admin Account
        shell: pwsh
        run: |
          $pw = ConvertTo-SecureString "Nexouya2026RdpX7" -AsPlainText -Force
          New-LocalUser -Name "NexAdmin" -Password $pw -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NexAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Nexouya2026RdpX7
          Write-Host "Accounts ready."

      # ══════════════════════════════════════════════
      #  3. Tailscale VPN
      # ══════════════════════════════════════════════
      - name: 3. Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\ts.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i C:\ts.msi /quiet /norestart" -Wait
          Start-Sleep 5
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp"
          Start-Sleep 8
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "======================================"
          Write-Host "  Tailscale IP : $ip"
          Write-Host "  Username     : NexAdmin"
          Write-Host "  Password     : Nexouya2026RdpX7"
          Write-Host "======================================"

      # ══════════════════════════════════════════════
      #  4. Install LDPlayer 9
      #     A) winget  (most reliable on GitHub runners)
      #     B) direct CDN with browser headers
      #     C) BITS transfer
      # ══════════════════════════════════════════════
      - name: 4. Install LDPlayer 9
        shell: pwsh
        run: |
          $installed = $false

          # A: winget
          Write-Host ">>> [A] winget..." -ForegroundColor Cyan
          try {
            winget source update --disable-interactivity | Out-Null
            winget install --id LDPlayer.LDPlayer9 --silent `
              --accept-package-agreements --accept-source-agreements `
              --disable-interactivity 2>&1 | Out-Null
            Start-Sleep 10
            $found = Get-ChildItem "C:\" -Filter "dnplayer.exe" -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if (-not $found) {
              winget install --id LDPlayer.LDPlayer --silent `
                --accept-package-agreements --accept-source-agreements `
                --disable-interactivity 2>&1 | Out-Null
              Start-Sleep 10
              $found = Get-ChildItem "C:\" -Filter "dnplayer.exe" -Recurse -ErrorAction SilentlyContinue |
                       Select-Object -First 1
            }
            if ($found) { Write-Host "winget OK: $($found.FullName)" -ForegroundColor Green; $installed = $true }
            else { Write-Host "winget done but dnplayer.exe not found." -ForegroundColor Yellow }
          } catch { Write-Host "winget error: $_" -ForegroundColor Yellow }

          # B: direct CDN with browser headers
          if (-not $installed) {
            Write-Host ">>> [B] CDN download with headers..." -ForegroundColor Cyan
            $hdrs = @{
              'User-Agent' = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0'
              'Referer'    = 'https://www.ldplayer.net/'
            }
            $urls = @(
              "https://encdn.ldmnq.com/download/package/LDPlayer9_en_installer.exe",
              "https://encdn.ldmnq.com/download/package/LDPlayer9_Setup_enOff.exe",
              "https://cdn.ldplayer.net/download/LDPlayer9_en_installer.exe"
            )
            foreach ($url in $urls) {
              try {
                Invoke-WebRequest $url -OutFile "C:\ld9.exe" -Headers $hdrs -UseBasicParsing -TimeoutSec 180
                if ((Get-Item "C:\ld9.exe").Length -gt 1MB) {
                  Start-Process "C:\ld9.exe" -ArgumentList "--silent" -Wait
                  Start-Sleep 15
                  $found = Get-ChildItem "C:\" -Filter "dnplayer.exe" -Recurse -ErrorAction SilentlyContinue |
                           Select-Object -First 1
                  if ($found) {
                    Write-Host "CDN OK: $($found.FullName)" -ForegroundColor Green
                    $installed = $true; break
                  }
                }
              } catch { Write-Host "  $url failed: $_" -ForegroundColor Yellow }
            }
          }

          # C: BITS
          if (-not $installed) {
            Write-Host ">>> [C] BITS transfer..." -ForegroundColor Cyan
            try {
              Start-BitsTransfer -Source "https://encdn.ldmnq.com/download/package/LDPlayer9_en_installer.exe" `
                -Destination "C:\ld9bits.exe" -TransferType Download -ErrorAction Stop
              if ((Get-Item "C:\ld9bits.exe").Length -gt 1MB) {
                Start-Process "C:\ld9bits.exe" -ArgumentList "--silent" -Wait
                Start-Sleep 15
                $found = Get-ChildItem "C:\" -Filter "dnplayer.exe" -Recurse -ErrorAction SilentlyContinue |
                         Select-Object -First 1
                if ($found) {
                  Write-Host "BITS OK: $($found.FullName)" -ForegroundColor Green
                  $installed = $true
                }
              }
            } catch { Write-Host "BITS failed: $_" -ForegroundColor Yellow }
          }

          if (-not $installed) {
            Write-Host "##[error] LDPlayer could not be installed." -ForegroundColor Red
            exit 1
          }
          Write-Host "LDPlayer 9 installed successfully." -ForegroundColor Green

      # ══════════════════════════════════════════════
      #  5. Find paths and create desktop tools
      #     (array-join pattern — no heredoc, YAML-safe)
      # ══════════════════════════════════════════════
      - name: 5. Configure and Create Desktop Tools
        shell: pwsh
        run: |
          $desk = "C:\Users\Public\Desktop"

          # Locate dnplayer.exe
          $dn = Get-ChildItem "C:\" -Filter "dnplayer.exe" -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
          if (-not $dn) { Write-Host "##[error] dnplayer.exe not found!"; exit 1 }
          $ldRoot = $dn.DirectoryName
          $dnPath = $dn.FullName

          # Locate adb.exe
          $adbExe = Get-ChildItem $ldRoot -Filter "adb.exe" -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          $adbPath = if ($adbExe) { $adbExe.FullName } else { "$ldRoot\adb.exe" }

          Write-Host "dnplayer : $dnPath"  -ForegroundColor Cyan
          Write-Host "adb      : $adbPath" -ForegroundColor Cyan

          # FILE 1 — 1 - START SAMSUNG PHONE.bat
          $f1 = @(
            '@echo off',
            'title Samsung Galaxy S23 FE - Virtual Phone',
            'color 0A',
            'echo.',
            'echo  =====================================================',
            'echo   SAMSUNG GALAXY S23 FE  -  LDPlayer 9',
            'echo  =====================================================',
            'echo.',
            "start `"`" `"$dnPath`"",
            'echo.',
            'echo  Wait for Android home screen (1-3 min).',
            'echo  Then run:  2 - SETUP SPOOF.bat',
            'echo.',
            'pause'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\1 - START SAMSUNG PHONE.bat", $f1,
            [System.Text.Encoding]::ASCII)

          # FILE 2 — 2 - SETUP SPOOF.bat
          $f2 = @(
            '@echo off',
            'title SETUP: Samsung S23 FE + TextNow',
            'color 0E',
            "set ADB=`"$adbPath`"",
            'echo.',
            'echo  =====================================================',
            'echo   Samsung S23 FE Identity Setup',
            'echo   Run AFTER LDPlayer shows the Android home screen',
            'echo  =====================================================',
            'echo.',
            'echo [1/8] Connecting ADB...',
            '%ADB% connect 127.0.0.1:5555 2>nul',
            'if errorlevel 1 (',
            '  echo   port 5555 failed, trying 5554...',
            '  %ADB% connect 127.0.0.1:5554 2>nul',
            ')',
            'timeout /t 3 /nobreak >nul',
            'echo [2/8] Getting root...',
            '%ADB% root',
            'timeout /t 4 /nobreak >nul',
            '%ADB% connect 127.0.0.1:5555 2>nul',
            'timeout /t 2 /nobreak >nul',
            'echo [3/8] Remounting /system...',
            '%ADB% shell mount -o rw,remount /system',
            'timeout /t 2 /nobreak >nul',
            'echo [4/8] Injecting Samsung S23 FE identity...',
            '%ADB% shell "sed -i 's/ro.product.manufacturer=.*/ro.product.manufacturer=samsung/' /system/build.prop"',
            '%ADB% shell "sed -i 's/ro.product.brand=.*/ro.product.brand=samsung/' /system/build.prop"',
            '%ADB% shell "sed -i 's/ro.product.model=.*/ro.product.model=SM-S711B/' /system/build.prop"',
            '%ADB% shell "sed -i 's/ro.product.name=.*/ro.product.name=SM-S711B/' /system/build.prop"',
            '%ADB% shell "sed -i 's/ro.product.device=.*/ro.product.device=s5e9925/' /system/build.prop"',
            '%ADB% shell "sed -i 's/ro.build.type=.*/ro.build.type=user/' /system/build.prop"',
            '%ADB% shell "sed -i 's/ro.build.tags=.*/ro.build.tags=release-keys/' /system/build.prop"',
            '%ADB% shell "sed -i 's/ro.build.version.release=.*/ro.build.version.release=14/' /system/build.prop"',
            r'%ADB% shell "grep -q ro.build.fingerprint /system/build.prop && sed -i "s|ro.build.fingerprint=.*|ro.build.fingerprint=samsung/SM-S711BXXS3AXEF/s5e9925:14/UP1A.231005.007/S711BXXS3AXEF:user/release-keys|" /system/build.prop || echo ro.build.fingerprint=samsung/SM-S711BXXS3AXEF/s5e9925:14/UP1A.231005.007/S711BXXS3AXEF:user/release-keys >> /system/build.prop"',
            'timeout /t 2 /nobreak >nul',
            'echo [5/8] Clearing GMS cache...',
            '%ADB% shell pm clear com.google.android.gms',
            '%ADB% shell pm clear com.android.vending',
            'timeout /t 2 /nobreak >nul',
            'echo [6/8] Downloading TextNow APK...',
            'powershell -Command "try{Invoke-WebRequest 'https://d.apkpure.net/b/APK/com.enflick.android.TextNow' -OutFile 'C:\textnow.apk' -UseBasicParsing -TimeoutSec 90}catch{}"',
            'timeout /t 3 /nobreak >nul',
            'echo [7/8] Installing TextNow...',
            'if exist C:\textnow.apk (',
            '  %ADB% install -r C:\textnow.apk',
            ') else (',
            '  echo   TextNow APK not found - install from Play Store inside LDPlayer',
            ')',
            'echo [8/8] Rebooting emulator...',
            '%ADB% reboot',
            'echo.',
            'echo  =====================================================',
            'echo   Done! After reboot:',
            'echo   1. Open TextNow app - get a free US number',
            'echo   2. Settings > Accounts > Add Account > Google',
            'echo   3. Enter TextNow number when asked',
            'echo   4. SMS code appears in TextNow app',
            'echo  =====================================================',
            'echo.',
            'pause'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\2 - SETUP SPOOF.bat", $f2,
            [System.Text.Encoding]::ASCII)

          # FILE 3 — 3 - GUIDE.txt
          $f3 = @(
            'SAMSUNG S23 FE - GMAIL CREATOR GUIDE',
            'rahnamaye sakht Gmail bedoone error',
            '',
            'Google 3 chiz check mikone:',
            '  [1] dastigah vagheieh?    <- Samsung S23 FE spoof hal shod',
            '  [2] SIM card dari?        <- ba TextNow (sho-mare raigan US) hal mishe',
            '  [3] robot hasti?          <- to khodet click mikoni',
            '',
            '---------------------------------------------------',
            '',
            'STEP 1 - "1 - START SAMSUNG PHONE.bat" ro ejra kon',
            '         sabr kon ta Android biad bala (1-3 daghighe)',
            '',
            'STEP 2 - "2 - SETUP SPOOF.bat" ro ejra kon',
            '         emulator khodkar restart mishe',
            '',
            'STEP 3 - ba az restart, app TextNow ro baz kon',
            '         account TextNow besaz (ba har emaili)',
            '         shomare raigan amrika begir',
            '',
            'STEP 4 - dar LDPlayer bero be:',
            '         Settings > Accounts > Add Account > Google',
            '         (az Settings goshy, na mororgar!)',
            '         vaghti shomare khast: shomare TextNow bede',
            '         kode SMS toye app TextNow miyad',
            '',
            '---------------------------------------------------',
            '',
            'Device identity after SETUP:',
            '  Model       : Samsung Galaxy S23 FE (SM-S711B)',
            '  Android     : 14',
            '  Fingerprint : samsung/.../release-keys',
            '',
            '---------------------------------------------------',
            'Barname-haye dige ro desktop (Unity, Firefox, Chrome...)',
            'az khood GitHub Actions image hastan, ma nashalshon nakardin.'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\3 - GUIDE (READ FIRST).txt", $f3,
            [System.Text.Encoding]::UTF8)

          Write-Host "Desktop toolkit created." -ForegroundColor Green
          Write-Host "  1 - START SAMSUNG PHONE.bat" -ForegroundColor Yellow
          Write-Host "  2 - SETUP SPOOF.bat"         -ForegroundColor Yellow
          Write-Host "  3 - GUIDE (READ FIRST).txt"  -ForegroundColor Yellow

      # ══════════════════════════════════════════════
      #  6. Keep server alive (6 hours)
      # ══════════════════════════════════════════════
      - name: 6. Keep Server Alive
        shell: pwsh
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server alive..."
          }
