name: Windows Cloud RDP

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ══════════════════════════════════════════════
      #  1. Enable Remote Desktop
      # ══════════════════════════════════════════════
      - name: 1. Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 0
          Write-Host "RDP enabled."

      # ══════════════════════════════════════════════
      #  2. Create Admin Account
      # ══════════════════════════════════════════════
      - name: 2. Create Admin Account
        shell: pwsh
        run: |
          $pw = ConvertTo-SecureString "Nexouya2026RdpX7" -AsPlainText -Force
          New-LocalUser -Name "NexAdmin" -Password $pw `
            -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" `
            -Member "NexAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Nexouya2026RdpX7
          Write-Host "Accounts ready."

      # ══════════════════════════════════════════════
      #  3. Tailscale VPN
      # ══════════════════════════════════════════════
      - name: 3. Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\ts.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i C:\ts.msi /quiet /norestart" -Wait
          Start-Sleep 5
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp"
          Start-Sleep 8
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "======================================"
          Write-Host "  Tailscale IP : $ip"
          Write-Host "  Username     : NexAdmin"
          Write-Host "  Password     : Nexouya2026RdpX7"
          Write-Host "======================================"

      # ══════════════════════════════════════════════
      #  4. Install MEmu Play
      #
      #  WHY MEmu instead of LDPlayer:
      #  - LDPlayer CDN (Alibaba OSS) returns NoSuchKey
      #    for every filename we tried. The files do not
      #    exist at those URLs — not a network block.
      #  - winget installed something in 7.5 min but
      #    dnplayer.exe was never found anywhere on C:      #  - MEmu has a stable public download URL that
      #    works from Azure/GitHub Actions IPs.
      #  - MEmu supports ADB root + build.prop spoof
      #    — identical approach, same result.
      # ══════════════════════════════════════════════
      - name: 4. Install MEmu Play
        shell: pwsh
        run: |
          $memuUrl  = "https://dl.memuplay.com/new_memuplay/setup/MEmu_installer.exe"
          $memuInst = "C:\memu_setup.exe"

          Write-Host ">>> Downloading MEmu Play..." -ForegroundColor Cyan
          $start = Get-Date
          try {
            Invoke-WebRequest $memuUrl -OutFile $memuInst `
              -UseBasicParsing -TimeoutSec 300
          } catch {
            Write-Host "Primary URL failed: $_ -- trying mirror..." -ForegroundColor Yellow
            Invoke-WebRequest "https://dl.memuplay.com/new_memuplay/cn/setup/MEmu_installer.exe" `
              -OutFile $memuInst -UseBasicParsing -TimeoutSec 300
          }

          $sz = (Get-Item $memuInst -ErrorAction SilentlyContinue).Length
          if (-not $sz -or $sz -lt 10MB) {
            Write-Host "##[error] MEmu download failed or file too small ($sz bytes)."
            exit 1
          }
          $elapsed = [math]::Round(((Get-Date) - $start).TotalSeconds, 1)
          Write-Host "Downloaded $([math]::Round($sz/1MB,1)) MB in ${elapsed}s." -ForegroundColor Green

          Write-Host ">>> Installing MEmu Play silently..." -ForegroundColor Cyan
          Start-Process $memuInst -ArgumentList "/S" -Wait
          Start-Sleep 20

          $memuExe = Get-ChildItem "C:\" -Filter "MEmu.exe" -Recurse `
                       -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $memuExe) {
            $memuExe = Get-ChildItem "C:\Program Files\Microvirt" -Filter "MEmu.exe" `
                         -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if ($memuExe) {
            Write-Host "MEmu installed: $($memuExe.FullName)" -ForegroundColor Green
          } else {
            Write-Host "##[error] MEmu.exe not found after install."
            exit 1
          }

      # ══════════════════════════════════════════════
      #  5. Find paths and create desktop tools
      # ══════════════════════════════════════════════
      - name: 5. Configure and Create Desktop Tools
        shell: pwsh
        run: |
          $desk = "C:\Users\Public\Desktop"

          # Locate MEmu.exe
          $memuExe = Get-ChildItem "C:\" -Filter "MEmu.exe" -Recurse `
                       -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $memuExe) {
            Write-Host "##[error] MEmu.exe not found!"
            exit 1
          }
          $memuRoot = $memuExe.DirectoryName
          $memuPath = $memuExe.FullName

          # Locate adb.exe (MEmu ships its own)
          $adbExe = Get-ChildItem $memuRoot -Filter "adb.exe" -Recurse `
                      -ErrorAction SilentlyContinue | Select-Object -First 1
          $adbPath = if ($adbExe) { $adbExe.FullName } else { "$memuRoot\adb.exe" }

          # MEmu ADB default port
          $adbPort = "21503"

          Write-Host "MEmu     : $memuPath"  -ForegroundColor Cyan
          Write-Host "adb      : $adbPath"   -ForegroundColor Cyan
          Write-Host "ADB port : $adbPort"   -ForegroundColor Cyan

          # FILE 1 — 1 - START SAMSUNG PHONE.bat
          $f1 = @(
            '@echo off',
            'title Samsung Galaxy S23 FE - MEmu Play',
            'color 0A',
            'echo.',
            'echo  =====================================================',
            'echo   SAMSUNG GALAXY S23 FE  -  MEmu Play',
            'echo  =====================================================',
            'echo.',
            "start `"`" `"$memuPath`"",
            'echo.',
            'echo  Wait for Android home screen (1-3 min).',
            'echo  Then run:  2 - SETUP SPOOF.bat',
            'echo.',
            'pause'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\1 - START SAMSUNG PHONE.bat", $f1,
            [System.Text.Encoding]::ASCII)

          # FILE 2 — 2 - SETUP SPOOF.bat
          $f2 = @(
            '@echo off',
            'title SETUP: Samsung S23 FE Identity + TextNow',
            'color 0E',
            "set ADB=`"$adbPath`"",
            "set PORT=$adbPort",
            'echo.',
            'echo  =====================================================',
            'echo   Samsung S23 FE Identity Setup - MEmu Play',
            'echo   Run AFTER MEmu shows the Android home screen',
            'echo  =====================================================',
            'echo.',
            'echo [1/8] Connecting ADB to MEmu (port %PORT%)...',
            '%ADB% connect 127.0.0.1:%PORT%',
            'timeout /t 4 /nobreak >nul',
            'echo [2/8] Getting root...',
            '%ADB% root',
            'timeout /t 5 /nobreak >nul',
            '%ADB% connect 127.0.0.1:%PORT%',
            'timeout /t 2 /nobreak >nul',
            'echo [3/8] Remounting /system as read-write...',
            '%ADB% shell mount -o rw,remount /system',
            'timeout /t 2 /nobreak >nul',
            'echo [4/8] Injecting Samsung Galaxy S23 FE identity...',
            "%ADB% shell "sed -i 's/ro.product.manufacturer=.*/ro.product.manufacturer=samsung/' /system/build.prop"",
            "%ADB% shell "sed -i 's/ro.product.brand=.*/ro.product.brand=samsung/' /system/build.prop"",
            "%ADB% shell "sed -i 's/ro.product.model=.*/ro.product.model=SM-S711B/' /system/build.prop"",
            "%ADB% shell "sed -i 's/ro.product.name=.*/ro.product.name=SM-S711B/' /system/build.prop"",
            "%ADB% shell "sed -i 's/ro.product.device=.*/ro.product.device=s5e9925/' /system/build.prop"",
            "%ADB% shell "sed -i 's/ro.build.type=.*/ro.build.type=user/' /system/build.prop"",
            "%ADB% shell "sed -i 's/ro.build.tags=.*/ro.build.tags=release-keys/' /system/build.prop"",
            "%ADB% shell "sed -i 's/ro.build.version.release=.*/ro.build.version.release=14/' /system/build.prop"",
            "%ADB% shell "grep -q ro.build.fingerprint /system/build.prop && sed -i 's|ro.build.fingerprint=.*|ro.build.fingerprint=samsung/SM-S711BXXS3AXEF/s5e9925:14/UP1A.231005.007/S711BXXS3AXEF:user/release-keys|' /system/build.prop || echo ro.build.fingerprint=samsung/SM-S711BXXS3AXEF/s5e9925:14/UP1A.231005.007/S711BXXS3AXEF:user/release-keys >> /system/build.prop"",
            'timeout /t 2 /nobreak >nul',
            'echo [5/8] Clearing Google Play Services cache...',
            '%ADB% shell pm clear com.google.android.gms',
            '%ADB% shell pm clear com.android.vending',
            'timeout /t 2 /nobreak >nul',
            'echo [6/8] Downloading TextNow APK...',
            "powershell -Command "try{Invoke-WebRequest 'https://d.apkpure.net/b/APK/com.enflick.android.TextNow' -OutFile 'C:\\textnow.apk' -UseBasicParsing -TimeoutSec 90}catch{}"",
            'timeout /t 3 /nobreak >nul',
            'echo [7/8] Installing TextNow...',
            'if exist C:\textnow.apk (',
            '  %ADB% install -r C:\textnow.apk',
            ') else (',
            '  echo   TextNow APK not found - install from Play Store inside MEmu',
            ')',
            'echo [8/8] Rebooting emulator to apply identity...',
            '%ADB% reboot',
            'echo.',
            'echo  =====================================================',
            'echo   Done! After reboot:',
            'echo   1. Open TextNow - get a free US number',
            'echo   2. Settings > Accounts > Add Account > Google',
            'echo   3. Use TextNow number when asked for phone',
            'echo   4. SMS code appears in TextNow app',
            'echo  =====================================================',
            'echo.',
            'pause'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\2 - SETUP SPOOF.bat", $f2,
            [System.Text.Encoding]::ASCII)

          # FILE 3 — Guide
          $f3 = @(
            'SAMSUNG S23 FE - GMAIL CREATOR (MEmu Play)',
            'Rahnamaye sakht Gmail bedoone error',
            '',
            'Google 3 chiz check mikone:',
            '  [1] dastigah vagheieh?    <- Samsung S23 FE spoof hal shod',
            '  [2] SIM card dari?        <- ba TextNow (shomare raigan US) hal mishe',
            '  [3] robot hasti?          <- to khodet click mikoni',
            '',
            '--------------------------------------------------',
            '',
            'STEP 1 - "1 - START SAMSUNG PHONE.bat" ejra kon',
            '         Sabr kon ta Android biad bala (1-3 daghighe)',
            '',
            'STEP 2 - "2 - SETUP SPOOF.bat" ejra kon',
            '         Emulator khodkar restart mishe',
            '',
            'STEP 3 - App TextNow ro baz kon',
            '         Account TextNow besaz (ba har emaili)',
            '         Shomare raigan amrika begir',
            '',
            'STEP 4 - Dar MEmu bero be:',
            '         Settings > Accounts > Add Account > Google',
            '         (Az Settings goshy, na mororgar!)',
            '         Vaghti shomare khast: shomare TextNow bede',
            '         Kode SMS toye app TextNow miyad',
            '',
            '--------------------------------------------------',
            'Device identity after SETUP:',
            '  Model   : Samsung Galaxy S23 FE (SM-S711B)',
            '  Android : 14',
            '  Build   : release-keys'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\3 - GUIDE (READ FIRST).txt", $f3,
            [System.Text.Encoding]::UTF8)

          Write-Host "Desktop toolkit created." -ForegroundColor Green
          Write-Host "  1 - START SAMSUNG PHONE.bat" -ForegroundColor Yellow
          Write-Host "  2 - SETUP SPOOF.bat"         -ForegroundColor Yellow
          Write-Host "  3 - GUIDE (READ FIRST).txt"  -ForegroundColor Yellow

      # ══════════════════════════════════════════════
      #  6. Keep server alive (6 hours)
      # ══════════════════════════════════════════════
      - name: 6. Keep Server Alive
        shell: pwsh
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server alive..."
          }
