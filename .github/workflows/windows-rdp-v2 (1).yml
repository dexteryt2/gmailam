name: Windows Cloud RDP

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ══════════════════════════════════════════════
      #  1. Enable Remote Desktop
      # ══════════════════════════════════════════════
      - name: 1. Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 0
          Write-Host "RDP enabled."

      # ══════════════════════════════════════════════
      #  2. Create Admin Account
      # ══════════════════════════════════════════════
      - name: 2. Create Admin Account
        shell: pwsh
        run: |
          $pw = ConvertTo-SecureString "Nexouya2026RdpX7" -AsPlainText -Force
          New-LocalUser -Name "NexAdmin" -Password $pw `
            -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" `
            -Member "NexAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Nexouya2026RdpX7
          Write-Host "Accounts ready."

      # ══════════════════════════════════════════════
      #  3. Tailscale VPN
      # ══════════════════════════════════════════════
      - name: 3. Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\ts.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i C:\ts.msi /quiet /norestart" -Wait
          Start-Sleep 5
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp"
          Start-Sleep 8
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "======================================"
          Write-Host "  Tailscale IP : $ip"
          Write-Host "  Username     : NexAdmin"
          Write-Host "  Password     : Nexouya2026RdpX7"
          Write-Host "======================================"

      # ══════════════════════════════════════════════
      #  4. Install MEmu Play
      #
      #  WHY MEmu instead of LDPlayer:
      #  - LDPlayer CDN (Alibaba OSS) returns NoSuchKey
      #    for every filename we tried. The files do not
      #    exist at those URLs — not a network block.
      #  - winget installed something in 7.5 min but
      #    dnplayer.exe was never found anywhere on C:      #  - MEmu has a stable public download URL that
      #    works from Azure/GitHub Actions IPs.
      #  - MEmu supports ADB root + build.prop spoof
      #    — identical approach, same result.
      # ══════════════════════════════════════════════
      - name: 4. Install MEmu Play
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'

          $memuInst = "C:\memu_setup.exe"
          New-Item C:\debug -ItemType Directory -Force | Out-Null

          # FIX: dl.memuplay.com CDN drops connection after ~4MB on GitHub Actions IPs.
          # curl exit 18 = partial transfer. Switch to Start-BitsTransfer (Windows BITS)
          # which uses chunked HTTP and handles reconnections natively.
          # Fallback: Invoke-WebRequest with browser headers.
          $urls = @(
            "https://dl.memuplay.com/download/Memu-Setup.exe",
            "http://dl.memuplay.com/download/Memu-Setup.exe"
          )

          Write-Host ">>> Downloading MEmu Play via BITS (~600 MB)..." -ForegroundColor Cyan
          $start = Get-Date
          $ok = $false

          foreach ($u in $urls) {
            if ($ok) { break }
            for ($try = 1; $try -le 3 -and -not $ok; $try++) {
              Write-Host "Trying BITS ($try/3): $u"
              Remove-Item $memuInst -Force -ErrorAction SilentlyContinue
              try {
                Start-BitsTransfer -Source $u -Destination $memuInst -ErrorAction Stop
                $sz = (Get-Item $memuInst -ErrorAction SilentlyContinue).Length
                if ($sz -gt 100MB) { $ok = $true; Write-Host "BITS OK: $sz bytes" -ForegroundColor Green }
                else { Write-Host "BITS partial: $sz bytes" -ForegroundColor Yellow }
              } catch {
                Write-Host "BITS failed: $_" -ForegroundColor Yellow
              }
            }
          }

          # Fallback: Invoke-WebRequest with browser headers
          if (-not $ok) {
            Write-Host "BITS failed, trying Invoke-WebRequest fallback..." -ForegroundColor Yellow
            foreach ($u in $urls) {
              if ($ok) { break }
              try {
                Remove-Item $memuInst -Force -ErrorAction SilentlyContinue
                $headers = @{
                  "User-Agent"      = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"
                  "Accept"          = "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                  "Accept-Language" = "en-US,en;q=0.5"
                  "Referer"         = "https://www.memuplay.com/"
                }
                Invoke-WebRequest $u -OutFile $memuInst -Headers $headers -TimeoutSec 600 -UseBasicParsing -ErrorAction Stop
                $sz = (Get-Item $memuInst -ErrorAction SilentlyContinue).Length
                if ($sz -gt 100MB) { $ok = $true; Write-Host "IWR OK: $sz bytes" -ForegroundColor Green }
                else { Write-Host "IWR partial: $sz bytes" -ForegroundColor Yellow }
              } catch {
                Write-Host "IWR failed: $_" -ForegroundColor Yellow
              }
            }
          }

          if (-not $ok) {
            Write-Host "##[error] MEmu download failed from all URLs."
            exit 1
          }
          $sz = (Get-Item $memuInst).Length
          $elapsed = [math]::Round(((Get-Date) - $start).TotalSeconds, 1)
          Write-Host "Downloaded $([math]::Round($sz/1MB,1)) MB in ${elapsed}s." -ForegroundColor Green

          Write-Host ">>> Installing MEmu Play silently..." -ForegroundColor Cyan

          function Find-Memu {
            # Search ALL fixed drives (runner has C: and D:), not only C:\Program Files
            $roots = @()
            foreach ($d in (Get-PSDrive -PSProvider FileSystem)) {
              foreach ($sub in "Program Files\Microvirt","Program Files (x86)\Microvirt","Microvirt","MEmu") {
                $r = Join-Path $d.Root $sub
                if (Test-Path $r) { $roots += $r }
              }
            }
            foreach ($r in $roots) {
              $f = Get-ChildItem $r -Filter "MEmu.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($f) { return $f }
            }
            # Registry fallback (uninstall entry)
            $keys = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
                    "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
            $e = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
                 Where-Object { $_.DisplayName -like "*MEmu*" } | Select-Object -First 1
            if ($e -and $e.InstallLocation -and (Test-Path "$($e.InstallLocation)\MEmu.exe")) {
              return Get-Item "$($e.InstallLocation)\MEmu.exe"
            }
            return $null
          }

          $p = Start-Process $memuInst -ArgumentList "/S" -PassThru
          $memuExe = $null
          $deadline = (Get-Date).AddMinutes(10)
          $tick = 0
          while ((Get-Date) -lt $deadline) {
            Start-Sleep 15
            $tick++
            $memuExe = Find-Memu
            if ($memuExe) { break }
            if ($tick % 4 -eq 0) {
              $alive = if ($p.HasExited) { "exited (code $($p.ExitCode))" } else { "still running" }
              Write-Host "[$($tick*15)s] installer $alive, MEmu.exe not found yet..."
            }
            # installer finished but nothing installed -> stop waiting early
            if ($p.HasExited -and $tick -ge 8) { break }
          }

          if ($memuExe) {
            Write-Host "MEmu installed: $($memuExe.FullName)" -ForegroundColor Green
            Start-Sleep 10
          } else {
            Write-Host "##[error] MEmu.exe not found after install. Diagnostics:"
            Write-Host "Installer exited: $($p.HasExited)  code: $(if ($p.HasExited) { $p.ExitCode } else { 'n/a' })"
            Write-Host "--- related processes ---"
            Get-Process | Where-Object { $_.Name -match 'memu|microvirt|setup|install|vbox' } |
              Format-Table Name, Id, Path -AutoSize | Out-String | Write-Host
            Write-Host "--- drives ---"
            Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free, Root -AutoSize | Out-String | Write-Host
            Write-Host "--- any Microvirt/MEmu folders ---"
            foreach ($d in (Get-PSDrive -PSProvider FileSystem)) {
              Get-ChildItem $d.Root -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match 'memu|microvirt' } | ForEach-Object { $_.FullName }
            }
            Write-Host "--- recent Windows Application errors ---"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-15)} `
              -MaxEvents 8 -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message | Out-String | Write-Host

            Write-Host "--- windows with a title (is the installer waiting on a GUI?) ---"
            Get-Process | Where-Object { $_.MainWindowTitle } |
              Select-Object Name, Id, MainWindowTitle | Format-Table -AutoSize | Out-String | Write-Host

            Write-Host "--- installer file type (7-Zip listing, first 40 lines) ---"
            $sevenZ = "C:\Program Files\7-Zip\7z.exe"
            if (Test-Path $sevenZ) { & $sevenZ l $memuInst 2>&1 | Select-Object -First 40 | ForEach-Object { Write-Host $_ } }
            $fs = [System.IO.File]::OpenRead($memuInst); $buf = New-Object byte[] 4; [void]$fs.Read($buf, 0, 4); $fs.Close()
            $hdr = $buf -join ","
            Write-Host "First bytes: $hdr  (77,90 = valid Windows exe)"

            Write-Host "--- screenshot + installer logs saved to C:\debug (uploaded as artifact) ---"
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save("C:\debug\screen_install.png")
            } catch { Write-Host "Screenshot failed: $_" }
            Get-ChildItem $env:TEMP, "C:\Windows\Temp" -Recurse -Include *.log, *memu*, *microvirt* -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-30) -and -not $_.PSIsContainer } |
              ForEach-Object { Copy-Item $_.FullName "C:\debug\$($_.Name)" -Force -ErrorAction SilentlyContinue }
            exit 1
          }

      # ══════════════════════════════════════════════
      #  4b. Virtualization diagnostics + MEmu boot test
      #  (tells you EXACTLY whether Hyper-V / VT-x blocks MEmu)
      # ══════════════════════════════════════════════
      - name: 4b. Virtualization Diagnostics and MEmu Boot Test
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item C:\debug -ItemType Directory -Force | Out-Null
          Start-Transcript -Path C:\debug\4b_boot_test.txt -Force | Out-Null

          Write-Host "===== CPU / hypervisor =====" -ForegroundColor Cyan
          Get-CimInstance Win32_ComputerSystem | Format-List Manufacturer, Model, HypervisorPresent | Out-String | Write-Host
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions | Out-String | Write-Host
          Write-Host "bcdedit hypervisor setting:"
          bcdedit /enum "{current}" | Select-String -Pattern "hypervisor" | ForEach-Object { Write-Host $_ }
          Write-Host "Windows features:"
          Get-WindowsOptionalFeature -Online -ErrorAction SilentlyContinue |
            Where-Object { $_.FeatureName -match 'Hyper-V|HypervisorPlatform|VirtualMachinePlatform' -and $_.State -eq 'Enabled' } |
            Format-Table FeatureName, State -AutoSize | Out-String | Write-Host
          Write-Host "Hyper-V services:"
          Get-Service vmms, hvhost, vmcompute -ErrorAction SilentlyContinue | Format-Table Name, Status -AutoSize | Out-String | Write-Host

          # ---- locate MEmu ----
          $memuExe = $null
          foreach ($d in (Get-PSDrive -PSProvider FileSystem)) {
            foreach ($sub in "Program Files\Microvirt","Program Files (x86)\Microvirt","Microvirt","MEmu") {
              $r = Join-Path $d.Root $sub
              if (-not $memuExe -and (Test-Path $r)) {
                $memuExe = Get-ChildItem $r -Filter "MEmu.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              }
            }
          }
          if (-not $memuExe) { Write-Host "##[error] MEmu.exe not found"; Stop-Transcript | Out-Null; exit 1 }
          $root   = $memuExe.DirectoryName
          $memuc  = Join-Path $root "memuc.exe"
          $manage = Join-Path $root "MEmuManage.exe"
          $adb    = (Get-ChildItem $root -Filter adb.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Write-Host "MEmu root: $root"
          Write-Host "memuc: $(Test-Path $memuc)  manage: $(Test-Path $manage)  adb: $adb"

          Write-Host "===== VM list =====" -ForegroundColor Cyan
          if (Test-Path $memuc)  { & $memuc listvms 2>&1 | ForEach-Object { Write-Host $_ } }
          if (Test-Path $manage) { & $manage list vms 2>&1 | ForEach-Object { Write-Host $_ } }

          # NOTE from the first real run: MEmu uses WinHvPlatform (it supports Hyper-V),
          # so Hyper-V is NOT the blocker. The VM crashed inside libOpenglRender.dll
          # (OpenGL renderer; the runner has no GPU). So we retry with DirectX rendering.
          function Test-Boot($label, $maxSec) {
            Write-Host "===== Boot test: $label (max $maxSec s) =====" -ForegroundColor Cyan
            & $memuc stop -i 0 2>&1 | Out-Null
            Start-Sleep 8
            $sp = Start-Process $memuc -ArgumentList "start -i 0" -PassThru -WindowStyle Hidden
            $sp | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
            for ($i = 1; $i -le [int]($maxSec / 15); $i++) {
              Start-Sleep 15
              & $adb connect 127.0.0.1:21503 2>&1 | Out-Null
              $bc  = (& $adb -s 127.0.0.1:21503 shell getprop sys.boot_completed 2>&1 | Out-String).Trim()
              $run = (& $memuc isvmrunning -i 0 2>&1 | Out-String).Trim()
              Write-Host "[$($i*15)s] vm_running='$run' boot_completed='$bc'"
              if ($bc -eq "1") { return $true }
              if ($i -ge 3 -and $run -match '(?i)not running') { Write-Host "VM process died early."; return $false }
            }
            return $false
          }

          $booted = $false
          if (-not (Test-Path $memuc)) { Write-Host "##[error] memuc.exe missing"; Stop-Transcript | Out-Null; exit 1 }

          # CONFIRMED by real run: OpenGL render mode hangs/crashes on the runner (no GPU),
          # DirectX (graphics_render_mode=1) boots in ~15 s. So set DirectX FIRST (persists in VM config).
          & $memuc stop -i 0 2>&1 | Out-Null
          Start-Sleep 5
          & $memuc setconfigex -i 0 graphics_render_mode 1 2>&1 | ForEach-Object { Write-Host "setconfigex: $_" }
          & $memuc getconfigex -i 0 graphics_render_mode   2>&1 | ForEach-Object { Write-Host "getconfigex: $_" }
          $booted = Test-Boot "DirectX (graphics_render_mode=1)" 150

          # Fallback only if that somehow failed: try the other key spelling
          foreach ($key in "graphic_render_mode") {
            if ($booted) { break }
            Write-Host "--- setting $key = 1 (DirectX) ---" -ForegroundColor Yellow
            & $memuc stop -i 0 2>&1 | Out-Null
            Start-Sleep 5
            & $memuc setconfigex -i 0 $key 1 2>&1 | ForEach-Object { Write-Host "setconfigex: $_" }
            & $memuc setconfig   -i 0 $key 1 2>&1 | ForEach-Object { Write-Host "setconfig  : $_" }
            & $memuc getconfigex -i 0 $key   2>&1 | ForEach-Object { Write-Host "getconfigex: $_" }
            $booted = Test-Boot "DirectX via $key" 150
          }

          Write-Host "===== Result =====" -ForegroundColor Cyan
          if ($booted) {
            Write-Host "BOOT OK - MEmu runs on this runner." -ForegroundColor Green
            & $adb -s 127.0.0.1:21503 shell getprop ro.product.model 2>&1 | ForEach-Object { Write-Host "Android model: $_" }
          } else {
            Write-Host "BOOT FAILED even with DirectX. See the crash summary below." -ForegroundColor Red
            $logs = Get-ChildItem $root -Recurse -Include *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3
            foreach ($lg in $logs) {
              Write-Host "##### $($lg.FullName)"
              Write-Host "--- first exception / error lines ---"
              Select-String -Path $lg.FullName -Pattern 'Xcpt|Exception|exception code|Fatal|VERR_|NEM|WHPX|Failed' -ErrorAction SilentlyContinue |
                Select-Object -First 15 | ForEach-Object { Write-Host $_.Line }
              Copy-Item $lg.FullName "C:\debug\$($lg.Name)" -Force -ErrorAction SilentlyContinue
            }
            Get-Process | Where-Object { $_.Name -match 'memu|vbox|microvirt' } | Format-Table Name, Id -AutoSize | Out-String | Write-Host
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("C:\debug\screen_boot.png")
          } catch { Write-Host "Screenshot failed: $_" }
          Stop-Transcript | Out-Null

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: C:\debug\
          if-no-files-found: ignore

      # ══════════════════════════════════════════════
      #  5. Find paths and create desktop tools
      # ══════════════════════════════════════════════
      - name: 5. Configure and Create Desktop Tools
        shell: pwsh
        run: |
          $desk = "C:\Users\Public\Desktop"

          # Locate MEmu.exe
          $memuExe = $null
          foreach ($d in (Get-PSDrive -PSProvider FileSystem)) {
            foreach ($sub in "Program Files\Microvirt","Program Files (x86)\Microvirt","Microvirt","MEmu") {
              $r = Join-Path $d.Root $sub
              if (-not $memuExe -and (Test-Path $r)) {
                $memuExe = Get-ChildItem $r -Filter "MEmu.exe" -Recurse `
                             -ErrorAction SilentlyContinue | Select-Object -First 1
              }
            }
          }
          if (-not $memuExe) {
            Write-Host "##[error] MEmu.exe not found!"
            exit 1
          }
          $memuRoot = $memuExe.DirectoryName
          $memuPath = $memuExe.FullName

          # Locate adb.exe (MEmu ships its own)
          $adbExe = Get-ChildItem $memuRoot -Filter "adb.exe" -Recurse `
                      -ErrorAction SilentlyContinue | Select-Object -First 1
          $adbPath = if ($adbExe) { $adbExe.FullName } else { "$memuRoot\adb.exe" }

          # MEmu ADB default port
          $adbPort = "21503"

          Write-Host "MEmu     : $memuPath"  -ForegroundColor Cyan
          Write-Host "adb      : $adbPath"   -ForegroundColor Cyan
          Write-Host "ADB port : $adbPort"   -ForegroundColor Cyan

          # FILE 1 — 1 - START SAMSUNG PHONE.bat
          $f1 = @(
            '@echo off',
            'title Samsung Galaxy S23 FE - MEmu Play',
            'color 0A',
            'echo.',
            'echo  =====================================================',
            'echo   SAMSUNG GALAXY S23 FE  -  MEmu Play',
            'echo  =====================================================',
            'echo.',
            "start `"`" `"$memuPath`"",
            'echo.',
            'echo  Wait for Android home screen (1-3 min).',
            'echo  Then run:  2 - SETUP SPOOF.bat',
            'echo.',
            'pause'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\1 - START SAMSUNG PHONE.bat", $f1,
            [System.Text.Encoding]::ASCII)

          # FILE 2 — 2 - SETUP SPOOF.bat
          $f2 = @(
            '@echo off',
            'title SETUP: Samsung S23 FE Identity + TextNow',
            'color 0E',
            "set ADB=`"$adbPath`"",
            "set PORT=$adbPort",
            'echo.',
            'echo  =====================================================',
            'echo   Samsung S23 FE Identity Setup - MEmu Play',
            'echo   Run AFTER MEmu shows the Android home screen',
            'echo  =====================================================',
            'echo.',
            'echo [1/8] Connecting ADB to MEmu (port %PORT%)...',
            '%ADB% connect 127.0.0.1:%PORT%',
            'timeout /t 4 /nobreak >nul',
            'echo [2/8] Getting root...',
            '%ADB% root',
            'timeout /t 5 /nobreak >nul',
            '%ADB% connect 127.0.0.1:%PORT%',
            'timeout /t 2 /nobreak >nul',
            'echo [3/8] Remounting /system as read-write...',
            '%ADB% shell mount -o rw,remount /system',
            'timeout /t 2 /nobreak >nul',
            'echo [4/8] Injecting Samsung Galaxy S23 FE identity...',
            '%ADB% shell "sed -i ''s/ro.product.manufacturer=.*/ro.product.manufacturer=samsung/'' /system/build.prop"',
            '%ADB% shell "sed -i ''s/ro.product.brand=.*/ro.product.brand=samsung/'' /system/build.prop"',
            '%ADB% shell "sed -i ''s/ro.product.model=.*/ro.product.model=SM-S711B/'' /system/build.prop"',
            '%ADB% shell "sed -i ''s/ro.product.name=.*/ro.product.name=SM-S711B/'' /system/build.prop"',
            '%ADB% shell "sed -i ''s/ro.product.device=.*/ro.product.device=s5e9925/'' /system/build.prop"',
            '%ADB% shell "sed -i ''s/ro.build.type=.*/ro.build.type=user/'' /system/build.prop"',
            '%ADB% shell "sed -i ''s/ro.build.tags=.*/ro.build.tags=release-keys/'' /system/build.prop"',
            '%ADB% shell "sed -i ''s/ro.build.version.release=.*/ro.build.version.release=14/'' /system/build.prop"',
            '%ADB% shell "grep -q ro.build.fingerprint /system/build.prop && sed -i ''s|ro.build.fingerprint=.*|ro.build.fingerprint=samsung/SM-S711BXXS3AXEF/s5e9925:14/UP1A.231005.007/S711BXXS3AXEF:user/release-keys|'' /system/build.prop || echo ro.build.fingerprint=samsung/SM-S711BXXS3AXEF/s5e9925:14/UP1A.231005.007/S711BXXS3AXEF:user/release-keys >> /system/build.prop"',
            'timeout /t 2 /nobreak >nul',
            'echo [5/8] Clearing Google Play Services cache...',
            '%ADB% shell pm clear com.google.android.gms',
            '%ADB% shell pm clear com.android.vending',
            'timeout /t 2 /nobreak >nul',
            'echo [6/8] Downloading TextNow APK...',
            'powershell -Command "try{Invoke-WebRequest ''https://d.apkpure.net/b/APK/com.enflick.android.TextNow'' -OutFile ''C:\textnow.apk'' -UseBasicParsing -TimeoutSec 90}catch{}"',
            'timeout /t 3 /nobreak >nul',
            'echo [7/8] Installing TextNow...',
            'if exist C:\textnow.apk (',
            '  %ADB% install -r C:\textnow.apk',
            ') else (',
            '  echo   TextNow APK not found - install from Play Store inside MEmu',
            ')',
            'echo [8/8] Rebooting emulator to apply identity...',
            '%ADB% reboot',
            'echo.',
            'echo  =====================================================',
            'echo   Done! After reboot:',
            'echo   1. Open TextNow - get a free US number',
            'echo   2. Settings > Accounts > Add Account > Google',
            'echo   3. Use TextNow number when asked for phone',
            'echo   4. SMS code appears in TextNow app',
            'echo  =====================================================',
            'echo.',
            'pause'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\2 - SETUP SPOOF.bat", $f2,
            [System.Text.Encoding]::ASCII)

          # FILE 3 — Guide
          $f3 = @(
            'SAMSUNG S23 FE - GMAIL CREATOR (MEmu Play)',
            'Rahnamaye sakht Gmail bedoone error',
            '',
            'Google 3 chiz check mikone:',
            '  [1] dastigah vagheieh?    <- Samsung S23 FE spoof hal shod',
            '  [2] SIM card dari?        <- ba TextNow (shomare raigan US) hal mishe',
            '  [3] robot hasti?          <- to khodet click mikoni',
            '',
