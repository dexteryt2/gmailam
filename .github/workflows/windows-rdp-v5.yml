name: Windows Cloud RDP

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ══════════════════════════════════════════════
      #  1. Enable Remote Desktop
      # ══════════════════════════════════════════════
      - name: 1. Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 0
          Write-Host "RDP enabled."

      # ══════════════════════════════════════════════
      #  2. Create Admin Account
      # ══════════════════════════════════════════════
      - name: 2. Create Admin Account
        shell: pwsh
        run: |
          $pw = ConvertTo-SecureString "Nexouya2026RdpX7" -AsPlainText -Force
          New-LocalUser -Name "NexAdmin" -Password $pw `
            -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" `
            -Member "NexAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Nexouya2026RdpX7
          Write-Host "Accounts ready."

      # ══════════════════════════════════════════════
      #  3. Tailscale VPN
      # ══════════════════════════════════════════════
      - name: 3. Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\ts.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i C:\ts.msi /quiet /norestart" -Wait
          Start-Sleep 5
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp"
          Start-Sleep 8
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "======================================"
          Write-Host "  Tailscale IP : $ip"
          Write-Host "  Username     : NexAdmin"
          Write-Host "  Password     : Nexouya2026RdpX7"
          Write-Host "======================================"

      # ══════════════════════════════════════════════
      #  4. Install MEmu Play
      #
      #  WHY MEmu instead of LDPlayer:
      #  - LDPlayer CDN (Alibaba OSS) returns NoSuchKey
      #    for every filename we tried. The files do not
      #    exist at those URLs — not a network block.
      #  - winget installed something in 7.5 min but
      #    dnplayer.exe was never found anywhere on C:      #  - MEmu has a stable public download URL that
      #    works from Azure/GitHub Actions IPs.
      #  - MEmu supports ADB root + build.prop spoof
      #    — identical approach, same result.
      # ══════════════════════════════════════════════
      - name: 4. Install Android Emulator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference    = 'SilentlyContinue'
          New-Item C:\debug -ItemType Directory -Force | Out-Null

          # ── Helper: find exe after install ───────────────────────────────
          function Find-Exe($name) {
            foreach ($d in (Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue)) {
              $f = Get-ChildItem $d.Root -Filter $name -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1
              if ($f) { return $f }
            }
            return $null
          }

          $installed = $false
          $emulatorType = ""

          # ════════════════════════════════════════════════════════
          #  ATTEMPT 1 — MEmu via curl.exe
          #  curl handles CDN redirects faster than BITS/IWR and
          #  supports resume (-C -) which BITS cannot do.
          # ════════════════════════════════════════════════════════
          Write-Host ">>> [1] Trying MEmu via curl.exe..." -ForegroundColor Cyan
          $memuInst = "C:\memu_setup.exe"
          Remove-Item $memuInst -Force -ErrorAction SilentlyContinue
          $curlArgs = @(
            "-L", "-f", "--retry", "4", "--retry-delay", "5", "--retry-connrefused",
            "--max-time", "480", "--connect-timeout", "30",
            "-C", "-",
            "-A", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0.0.0 Safari/537.36",
            "-H", "Referer: https://www.memuplay.com/",
            "-H", "Accept: application/octet-stream,*/*",
            "-o", $memuInst,
            "https://dl.memuplay.com/download/Memu-Setup.exe"
          )
          & curl.exe @curlArgs 2>&1 | Out-Null
          $sz = (Get-Item $memuInst -ErrorAction SilentlyContinue).Length
          if ($sz -gt 100MB) {
            Write-Host "curl OK: $([math]::Round($sz/1MB,1)) MB" -ForegroundColor Green
            Start-Process $memuInst -ArgumentList "/S" -Wait; Start-Sleep 20
            $f = Find-Exe "MEmu.exe"
            if ($f) { Write-Host "MEmu installed: $($f.FullName)" -ForegroundColor Green; $installed=$true; $emulatorType="memu" }
          } else { Write-Host "curl partial/failed ($sz bytes) — moving on." -ForegroundColor Yellow }

          # ════════════════════════════════════════════════════════
          #  ATTEMPT 2 — MEmu via winget
          # ════════════════════════════════════════════════════════
          if (-not $installed) {
            Write-Host ">>> [2] Trying MEmu via winget..." -ForegroundColor Cyan
            try {
              winget source update --disable-interactivity 2>&1 | Out-Null
              foreach ($id in @("Microvirt.MEmuAndroid","Microvirt.MEmu","MEmu.MEmu")) {
                $r = winget install --id $id --silent --accept-package-agreements `
                     --accept-source-agreements --disable-interactivity 2>&1
                Start-Sleep 15
                $f = Find-Exe "MEmu.exe"
                if ($f) {
                  Write-Host "winget OK ($id): $($f.FullName)" -ForegroundColor Green
                  $installed=$true; $emulatorType="memu"; break
                }
              }
            } catch { Write-Host "winget failed: $_" -ForegroundColor Yellow }
          }

          # ════════════════════════════════════════════════════════
          #  ATTEMPT 3 — NoxPlayer (bignox.com CDN — different from MEmu)
          #  NoxPlayer uses its own Hyper-V-compatible hypervisor.
          # ════════════════════════════════════════════════════════
          if (-not $installed) {
            Write-Host ">>> [3] MEmu CDN unreachable from this region. Trying NoxPlayer..." -ForegroundColor Yellow
            $noxInst = "C:\nox_setup.exe"
            $noxUrls = @(
              "https://res-download-hw.bignox.com/full/NoxPlayer_installer.exe",
              "https://res.bignox.com/full/NoxPlayer_installer.exe"
            )
            foreach ($url in $noxUrls) {
              Write-Host "  Downloading NoxPlayer from: $url" -ForegroundColor Cyan
              Remove-Item $noxInst -Force -ErrorAction SilentlyContinue
              & curl.exe -L -f --retry 3 --retry-delay 5 --max-time 480 `
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0.0.0 Safari/537.36" `
                -H "Referer: https://www.bignox.com/" `
                -o $noxInst $url 2>&1 | Out-Null
              $sz = (Get-Item $noxInst -ErrorAction SilentlyContinue).Length
              if ($sz -gt 100MB) {
                Write-Host "  Downloaded $([math]::Round($sz/1MB,1)) MB. Installing..." -ForegroundColor Green
                Start-Process $noxInst -ArgumentList "/S" -Wait; Start-Sleep 25
                $f = Find-Exe "Nox.exe"
                if ($f) {
                  Write-Host "NoxPlayer installed: $($f.FullName)" -ForegroundColor Green
                  $installed=$true; $emulatorType="nox"; break
                }
              } else { Write-Host "  NoxPlayer download partial ($sz bytes), trying next URL..." -ForegroundColor Yellow }
            }
          }

          # ════════════════════════════════════════════════════════
          #  Result
          # ════════════════════════════════════════════════════════
          if (-not $installed) {
            Write-Host "##[error] No emulator could be installed."
            exit 1
          }
          $emulatorType | Set-Content "C:\emulator_type.txt" -Encoding ASCII
          Write-Host "Emulator ready: $emulatorType" -ForegroundColor Green


      # ══════════════════════════════════════════════
      #  4b. Virtualization diagnostics + MEmu boot test
      #  (tells you EXACTLY whether Hyper-V / VT-x blocks MEmu)
      # ══════════════════════════════════════════════
      - name: 4b. Virtualization Diagnostics and MEmu Boot Test
        shell: pwsh
        continue-on-error: true
        run: |
          # Skip if NoxPlayer was installed instead of MEmu
          if (Test-Path "C:\emulator_type.txt") {
            $etype = (Get-Content "C:\emulator_type.txt" -Raw).Trim()
            if ($etype -ne "memu") {
              Write-Host "Emulator is '$etype' (not MEmu) — skipping MEmu boot test." -ForegroundColor Yellow
              exit 0
            }
          }
          New-Item C:\debug -ItemType Directory -Force | Out-Null
          Start-Transcript -Path C:\debug\4b_boot_test.txt -Force | Out-Null

          Write-Host "===== CPU / hypervisor =====" -ForegroundColor Cyan
          Get-CimInstance Win32_ComputerSystem | Format-List Manufacturer, Model, HypervisorPresent | Out-String | Write-Host
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions | Out-String | Write-Host
          Write-Host "bcdedit hypervisor setting:"
          bcdedit /enum "{current}" | Select-String -Pattern "hypervisor" | ForEach-Object { Write-Host $_ }
          Write-Host "Windows features:"
          Get-WindowsOptionalFeature -Online -ErrorAction SilentlyContinue |
            Where-Object { $_.FeatureName -match 'Hyper-V|HypervisorPlatform|VirtualMachinePlatform' -and $_.State -eq 'Enabled' } |
            Format-Table FeatureName, State -AutoSize | Out-String | Write-Host
          Write-Host "Hyper-V services:"
          Get-Service vmms, hvhost, vmcompute -ErrorAction SilentlyContinue | Format-Table Name, Status -AutoSize | Out-String | Write-Host

          # ---- locate MEmu ----
          $memuExe = $null
          foreach ($d in (Get-PSDrive -PSProvider FileSystem)) {
            foreach ($sub in "Program Files\Microvirt","Program Files (x86)\Microvirt","Microvirt","MEmu") {
              $r = Join-Path $d.Root $sub
              if (-not $memuExe -and (Test-Path $r)) {
                $memuExe = Get-ChildItem $r -Filter "MEmu.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              }
            }
          }
          if (-not $memuExe) { Write-Host "##[error] MEmu.exe not found"; Stop-Transcript | Out-Null; exit 1 }
          $root   = $memuExe.DirectoryName
          $memuc  = Join-Path $root "memuc.exe"
          $manage = Join-Path $root "MEmuManage.exe"
          $adb    = (Get-ChildItem $root -Filter adb.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Write-Host "MEmu root: $root"
          Write-Host "memuc: $(Test-Path $memuc)  manage: $(Test-Path $manage)  adb: $adb"

          Write-Host "===== VM list =====" -ForegroundColor Cyan
          if (Test-Path $memuc)  { & $memuc listvms 2>&1 | ForEach-Object { Write-Host $_ } }
          if (Test-Path $manage) { & $manage list vms 2>&1 | ForEach-Object { Write-Host $_ } }

          # NOTE from the first real run: MEmu uses WinHvPlatform (it supports Hyper-V),
          # so Hyper-V is NOT the blocker. The VM crashed inside libOpenglRender.dll
          # (OpenGL renderer; the runner has no GPU). So we retry with DirectX rendering.
          function Test-Boot($label, $maxSec) {
            Write-Host "===== Boot test: $label (max $maxSec s) =====" -ForegroundColor Cyan
            & $memuc stop -i 0 2>&1 | Out-Null
            Start-Sleep 8
            $sp = Start-Process $memuc -ArgumentList "start -i 0" -PassThru -WindowStyle Hidden
            $sp | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
            for ($i = 1; $i -le [int]($maxSec / 15); $i++) {
              Start-Sleep 15
              & $adb connect 127.0.0.1:21503 2>&1 | Out-Null
              $bc  = (& $adb -s 127.0.0.1:21503 shell getprop sys.boot_completed 2>&1 | Out-String).Trim()
              $run = (& $memuc isvmrunning -i 0 2>&1 | Out-String).Trim()
              Write-Host "[$($i*15)s] vm_running='$run' boot_completed='$bc'"
              if ($bc -eq "1") { return $true }
              if ($i -ge 3 -and $run -match '(?i)not running') { Write-Host "VM process died early."; return $false }
            }
            return $false
          }

          $booted = $false
          if (-not (Test-Path $memuc)) { Write-Host "##[error] memuc.exe missing"; Stop-Transcript | Out-Null; exit 1 }

          # CONFIRMED by real run: OpenGL render mode hangs/crashes on the runner (no GPU),
          # DirectX (graphics_render_mode=1) boots in ~15 s. So set DirectX FIRST (persists in VM config).
          & $memuc stop -i 0 2>&1 | Out-Null
          Start-Sleep 5
          & $memuc setconfigex -i 0 graphics_render_mode 1 2>&1 | ForEach-Object { Write-Host "setconfigex: $_" }
          & $memuc getconfigex -i 0 graphics_render_mode   2>&1 | ForEach-Object { Write-Host "getconfigex: $_" }
          $booted = Test-Boot "DirectX (graphics_render_mode=1)" 150

          # Fallback only if that somehow failed: try the other key spelling
          foreach ($key in "graphic_render_mode") {
            if ($booted) { break }
            Write-Host "--- setting $key = 1 (DirectX) ---" -ForegroundColor Yellow
            & $memuc stop -i 0 2>&1 | Out-Null
            Start-Sleep 5
            & $memuc setconfigex -i 0 $key 1 2>&1 | ForEach-Object { Write-Host "setconfigex: $_" }
            & $memuc setconfig   -i 0 $key 1 2>&1 | ForEach-Object { Write-Host "setconfig  : $_" }
            & $memuc getconfigex -i 0 $key   2>&1 | ForEach-Object { Write-Host "getconfigex: $_" }
            $booted = Test-Boot "DirectX via $key" 150
          }

          Write-Host "===== Result =====" -ForegroundColor Cyan
          if ($booted) {
            Write-Host "BOOT OK - MEmu runs on this runner." -ForegroundColor Green
            & $adb -s 127.0.0.1:21503 shell getprop ro.product.model 2>&1 | ForEach-Object { Write-Host "Android model: $_" }
          } else {
            Write-Host "BOOT FAILED even with DirectX. See the crash summary below." -ForegroundColor Red
            $logs = Get-ChildItem $root -Recurse -Include *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3
            foreach ($lg in $logs) {
              Write-Host "##### $($lg.FullName)"
              Write-Host "--- first exception / error lines ---"
              Select-String -Path $lg.FullName -Pattern 'Xcpt|Exception|exception code|Fatal|VERR_|NEM|WHPX|Failed' -ErrorAction SilentlyContinue |
                Select-Object -First 15 | ForEach-Object { Write-Host $_.Line }
              Copy-Item $lg.FullName "C:\debug\$($lg.Name)" -Force -ErrorAction SilentlyContinue
            }
            Get-Process | Where-Object { $_.Name -match 'memu|vbox|microvirt' } | Format-Table Name, Id -AutoSize | Out-String | Write-Host
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("C:\debug\screen_boot.png")
          } catch { Write-Host "Screenshot failed: $_" }
          Stop-Transcript | Out-Null

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: C:\debug\
          if-no-files-found: ignore

      # ══════════════════════════════════════════════
      #  5. Find paths and create desktop tools
      # ══════════════════════════════════════════════
      - name: 5. Configure and Create Desktop Tools
        shell: pwsh
        run: |
          $desk = "C:\Users\Public\Desktop"

          # Detect which emulator was installed
          $emulatorType = "memu"
          if (Test-Path "C:\emulator_type.txt") {
            $emulatorType = (Get-Content "C:\emulator_type.txt" -Raw).Trim()
          }
          Write-Host "Configuring for: $emulatorType" -ForegroundColor Cyan

          # Locate emulator exe + set port
          $emulatorExe  = $null
          $adbPort      = "21503"
          $consoleName  = "memuc.exe"
          $emuFilter    = if ($emulatorType -eq "nox") { "Nox.exe" } else { "MEmu.exe" }
          if ($emulatorType -eq "nox") { $adbPort = "62001"; $consoleName = "NoxConsole.exe" }

          foreach ($d in (Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue)) {
            $f = Get-ChildItem $d.Root -Filter $emuFilter -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch 'NoxInstall|Uninstall' } |
                 Select-Object -First 1
            if ($f) { $emulatorExe = $f; break }
          }
          if (-not $emulatorExe) {
            Write-Host "##[error] $emuFilter not found!"
            exit 1
          }
          $emuRoot     = $emulatorExe.DirectoryName
          $memuPath    = $emulatorExe.FullName   # used in bat templates
          $adbExe      = Get-ChildItem $emuRoot -Filter "adb.exe" -Recurse -ErrorAction SilentlyContinue |
                         Select-Object -First 1
          $adbPath     = if ($adbExe) { $adbExe.FullName } else { "$emuRoot\adb.exe" }
          $conExe      = Get-ChildItem $emuRoot -Filter $consoleName -Recurse -ErrorAction SilentlyContinue |
                         Select-Object -First 1
          $memuConsole = if ($conExe) { $conExe.FullName } else { "$emuRoot\$consoleName" }

          Write-Host "Exe     : $memuPath"    -ForegroundColor Cyan
          Write-Host "ADB     : $adbPath"     -ForegroundColor Cyan
          Write-Host "Port    : $adbPort"     -ForegroundColor Cyan
          Write-Host "Console : $memuConsole" -ForegroundColor Cyan
          $memuRoot = $memuExe.DirectoryName
          $memuPath = $memuExe.FullName

          # Locate adb.exe (MEmu ships its own)
          $adbExe = Get-ChildItem $memuRoot -Filter "adb.exe" -Recurse `
                      -ErrorAction SilentlyContinue | Select-Object -First 1
          $adbPath = if ($adbExe) { $adbExe.FullName } else { "$memuRoot\adb.exe" }

          # MEmu ADB default port
          $adbPort = "21503"

          Write-Host "MEmu     : $memuPath"  -ForegroundColor Cyan
          Write-Host "adb      : $adbPath"   -ForegroundColor Cyan
          Write-Host "ADB port : $adbPort"   -ForegroundColor Cyan

          # FILE 1 — 1 - START SAMSUNG PHONE.bat
          # FIX: MEmu.exe crashes when launched cold after cleanup.
          # Solution: use `memuc start` to boot the VM first (always works),
          # then open MEmu.exe for the display window.
          $memuConsole = "$memuRoot\memuc.exe"
          $f1 = @(
            '@echo off',
            'title Samsung Galaxy S23 FE - MEmu Play',
            'color 0A',
            "set MEMUC=`"$memuConsole`"",
            "set MEMUE=`"$memuPath`"",
            'echo.',
            'echo  =====================================================',
            'echo   SAMSUNG GALAXY S23 FE  -  MEmu Play',
            'echo  =====================================================',
            'echo.',
            'echo [1/3] Stopping any stale MEmu processes...',
            'taskkill /F /IM MEmu.exe /IM MEmuHeadless.exe /IM MEmuSVC.exe 2>nul',
            'timeout /t 4 /nobreak >nul',
            'echo [2/3] Setting DirectX mode and starting Android VM...',
            '%MEMUC% setconfigex -i 0 graphics_render_mode 1 2>nul',
            'timeout /t 2 /nobreak >nul',
            '%MEMUC% start -i 0',
            'echo   VM starting - waiting 15 seconds...',
            'timeout /t 15 /nobreak >nul',
            'echo [3/3] Opening MEmu display window...',
            'start "" %MEMUE%',
            'echo.',
            'echo  DO NOT close this window!',
            'echo  Wait until the Android home screen appears in MEmu.',
            'echo  (usually 1-3 minutes)',
            'echo.',
            'echo  When Android is fully loaded:',
            'echo   1. Press any key here',
            'echo   2. Then run:  2 - SETUP SPOOF.bat',
            'echo.',
            'pause',
            'echo.',
            'echo  Good. Now run:  2 - SETUP SPOOF.bat',
            'echo.',
            'pause'
          ) -join "`r`n"
          [System.IO.File]::WriteAllText(
            "$desk\1 - START SAMSUNG PHONE.bat", $f1,
            [System.Text.Encoding]::ASCII)

          # FILE 2 — 2 - SETUP SPOOF.bat
          # Strategy:
          # A) gsm.* injection via setprop (root, no /system needed) → US SIM simulation
          # B) Try adb remount for build.prop (optional Samsung model spoof)
          # C) TextNow install for real receivable US phone number
          $f2 = @(
            '@echo off',
            'title SETUP: Samsung S23 FE + US SIM + TextNow',
            'color 0E',
            "set ADB=`"$adbPath`"",
            "set PORT=$adbPort",
            "set MEMUC=`"$memuConsole`"",
            'echo.',
            'echo  =====================================================',
            'echo   FULL SETUP: US SIM + Samsung Identity + TextNow',
            'echo   Run AFTER MEmu shows the Android home screen',
            'echo  =====================================================',
            'echo.',
            'echo [1/7] Connecting ADB...',
            '%ADB% connect 127.0.0.1:%PORT%',
            'timeout /t 4 /nobreak >nul',
            'echo [2/7] Getting root...',
            '%ADB% root',
            'timeout /t 5 /nobreak >nul',
            '%ADB% connect 127.0.0.1:%PORT%',
            'timeout /t 2 /nobreak >nul',
            'echo.',
            'echo  =====================================================',
            'echo   [3/7] Injecting US T-Mobile SIM card...',
            'echo   (gsm.* properties - root setprop, no /system needed)',
            'echo  =====================================================',
            '%ADB% shell setprop gsm.sim.state READY',
            '%ADB% shell setprop gsm.sim.operator.alpha T-Mobile',
            '%ADB% shell setprop gsm.sim.operator.numeric 310260',
            '%ADB% shell setprop gsm.sim.operator.iso-country us',
            '%ADB% shell setprop gsm.operator.alpha T-Mobile',
            '%ADB% shell setprop gsm.operator.numeric 310260',
            '%ADB% shell setprop gsm.operator.iso-country us',
            '%ADB% shell setprop gsm.network.type LTE',
            '%ADB% shell setprop gsm.defaultpdpcontext.active true',
            '%ADB% shell setprop ril.simready 1',
            '%ADB% shell setprop persist.radio.simstate 1',
            'echo   Verifying SIM state:',
            '%ADB% shell getprop gsm.sim.state',
            '%ADB% shell getprop gsm.operator.alpha',
            '%ADB% shell getprop gsm.operator.iso-country',
            'timeout /t 2 /nobreak >nul',
            'echo.',
            'echo  =====================================================',
            'echo   [4/7] Samsung S23 FE model via memuc setconfigex...',
            'echo  =====================================================',
            '%MEMUC% setconfigex -i 0 manufacturer samsung 2>nul',
            '%MEMUC% setconfigex -i 0 model SM-S711B 2>nul',
            '%MEMUC% setconfigex -i 0 brand samsung 2>nul',
            '%MEMUC% setconfigex -i 0 imei 358240051111110 2>nul',
            'echo   memuc identity config done.',
            'timeout /t 2 /nobreak >nul',
            'echo.',
            'echo  =====================================================',
            'echo   [5/7] Trying adb remount for build.prop spoof...',
            'echo   (bonus - continues even if /system stays read-only)',
            'echo  =====================================================',
            '%ADB% remount 2>nul',
            'timeout /t 4 /nobreak >nul',
            '%ADB% shell "touch /system/.rw_test 2>/dev/null && rm /system/.rw_test 2>/dev/null && echo SYSTEM_WRITABLE || echo SYSTEM_READONLY"',
            'timeout /t 2 /nobreak >nul',
            '%ADB% shell "sed -i ''s/ro.product.manufacturer=.*/ro.product.manufacturer=samsung/'' /system/build.prop 2>/dev/null"',
            '%ADB% shell "sed -i ''s/ro.product.model=.*/ro.product.model=SM-S711B/'' /system/build.prop 2>/dev/null"',
            '%ADB% shell "sed -i ''s/ro.product.brand=.*/ro.product.brand=samsung/'' /system/build.prop 2>/dev/null"',
